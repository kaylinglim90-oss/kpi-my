<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KPI.MY Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:40px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:40px;
}

.header h1{
font-size:48px;
margin-bottom:10px;
}

.header p{
color:#94a3b8;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:40px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:15px;
}

.card h3{
color:#94a3b8;
font-size:14px;
margin-bottom:10px;
}

.card h2{
font-size:32px;
}

.buttons{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-bottom:40px;
}

.btn{
padding:15px 25px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
text-decoration:none;
color:white;
}

.primary{
background:#3b82f6;
}

.success{
background:#22c55e;
}

.warning{
background:#f59e0b;
}

.section{
background:#1e293b;
padding:25px;
border-radius:15px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #334155;
text-align:left;
}

th{
color:#94a3b8;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>KPI.MY</h1>
<p>Team Evaluation & Performance Dashboard</p>
</div>

<div class="cards">

<div class="card">
<h3>Total Evaluation</h3>
<h2>16</h2>
</div>

<div class="card">
<h3>Average Score</h3>
<h2>6.4</h2>
</div>

<div class="card">
<h3>Best Employee</h3>
<h2>Bas</h2>
</div>

<div class="card">
<h3>Departments</h3>
<h2>8</h2>
</div>

</div>

<div class="buttons">

<a class="btn primary"
href="https://docs.google.com/spreadsheets/d/1tsTW9w658eMqpnfFPnxkwrKlO5CJ5P4_hDFTI8oDa58/edit?resourcekey=&gid=867916103#gid=867916103"
target="_blank">
📝 Start Evaluation
</a>

<a class="btn success"
href="#">
🏆 Leaderboard
</a>

<a class="btn warning"
href="#">
📊 KPI Report
</a>

</div>

<div class="section">

<h2 style="margin-bottom:20px;">Top Employees</h2>

<table>

<tr>
<th>Rank</th>
<th>Name</th>
<th>Score</th>
</tr>

<tr>
<td>1</td>
<td>Bas</td>
<td>7.8</td>
</tr>

<tr>
<td>2</td>
<td>Pin</td>
<td>7.4</td>
</tr>

<tr>
<td>3</td>
<td>Jay</td>
<td>7.4</td>
</tr>

</table>

</div>

</div>

</body>
</html>
