<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KPI.MY Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:40px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:40px;
}

.header h1{
font-size:48px;
margin-bottom:10px;
}

.header p{
color:#94a3b8;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:40px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:15px;
}

.card h3{
color:#94a3b8;
font-size:14px;
margin-bottom:10px;
}

.card h2{
font-size:32px;
}

.buttons{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-bottom:40px;
}

.btn{
padding:15px 25px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
text-decoration:none;
color:white;
}

.primary{
background:#3b82f6;
}

.success{
background:#22c55e;
}

.warning{
background:#f59e0b;
}

.section{
background:#1e293b;
padding:25px;
border-radius:15px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #334155;
text-align:left;
}

th{
color:#94a3b8;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>KPI.MY</h1>
<p>Team Evaluation & Performance Dashboard</p>
</div>

<div class="cards">

<div class="card">
<h3>Total Evaluation</h3>
<h2 id="totalEvaluation">0</h2>
</div>

<div class="card">
<h3>Average Score</h3>
<h2 id="averageScore">0</h2>
</div>

<div class="card">
<h3>Best Employee</h3>
<h2 id="bestEmployee">-</h2>
</div>

<div class="card">
<h3>Departments</h3>
<h2 id="departmentCount">0</h2>
</div>

</div>

<div class="buttons">

<a class="btn primary"
href="https://docs.google.com/forms/d/e/1FAIpQLSfTXY6Ly4zjUMmhmmvFOg83csSkHD0Mj_xLA6t4LFzt-tneEg/viewform?usp=header"
target="_blank">
📝 Start Evaluation </a>

<a class="btn success"
href="#leaderboard-section">
🏆 Leaderboard </a>

<a class="btn warning"
href="#leaderboard-section">
📊 KPI Report </a>

</div>

<div class="section" id="leaderboard-section">

<h2 style="margin-bottom:20px;">
🏆 Employee Leaderboard
</h2>

<table>

<thead>
<tr>
<th>Rank</th>
<th>Name</th>
<th>Department</th>
<th>Score</th>
<th>Status</th>
</tr>
</thead>

<tbody id="leaderboard">
</tbody>

</table>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/library/d/1aVMnNdcf0q4PfMpE_zH6_eq8sMLIBRwYjRuPV0CdXQZ4wELGqa_6zkJl/2";

fetch(API_URL)
.then(response => response.json())
.then(data => {

data = data.filter(x => x.employee);

data.sort((a,b)=>
parseFloat(b.score) - parseFloat(a.score)
);

document.getElementById("totalEvaluation")
.innerText = data.length;

let totalScore = 0;

data.forEach(item => {
totalScore += parseFloat(item.score);
});

document.getElementById("averageScore")
.innerText =
(totalScore / data.length).toFixed(1);

document.getElementById("bestEmployee")
.innerText =
data[0]?.employee || "-";

const departments =
new Set(
data.map(x => x.department)
);

document.getElementById("departmentCount")
.innerText =
departments.size;

const table =
document.getElementById("leaderboard");

table.innerHTML = "";

data.forEach((user,index)=>{

table.innerHTML += `
<tr>
<td>${index+1}</td>
<td>${user.employee}</td>
<td>${user.department}</td>
<td>${user.score}</td>
<td>${user.status}</td>
</tr>
`;

});

})
.catch(error=>{
console.error(error);
});

</script>

</body>
</html>
